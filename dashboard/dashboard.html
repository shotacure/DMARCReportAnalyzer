<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title data-i18n="extensionName">DMARC Report Analyzer</title>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <div class="drv-container">
    <div class="drv-header">
      <h1 class="drv-title">
        <span class="drv-icon">📊</span>
        <span data-i18n="extensionName">DMARC Report Analyzer</span>
      </h1>
      <div class="drv-header-actions">
        <select id="period-select" class="drv-period-select">
          <option value="7" data-i18n="period1w">1 Week</option>
          <option value="30" selected data-i18n="period1m">1 Month</option>
          <option value="90" data-i18n="period3m">3 Months</option>
          <option value="180" data-i18n="period6m">6 Months</option>
          <option value="365" data-i18n="period1y">1 Year</option>
          <option value="0" data-i18n="periodAll">All</option>
        </select>
        <button id="btn-scan" class="drv-btn drv-btn-primary" data-i18n="btnScan">Scan Reports</button>
        <!-- ドメイン名クイックフィルタ (ドメインが2つ以上ある場合のみ表示) -->
        <input id="domain-filter" type="search" class="drv-domain-filter drv-hidden" data-i18n-placeholder="filterDomains" placeholder="Filter domains…">
        <!-- CSV エクスポートボタン (スキャン結果がある場合のみ有効) -->
        <button id="btn-export" class="drv-btn drv-btn-secondary drv-hidden" data-i18n="btnExport">Export CSV</button>
        <!-- JSON エクスポートボタン (SIEM/スクリプト連携用) -->
        <button id="btn-export-json" class="drv-btn drv-btn-secondary drv-hidden" data-i18n="btnExportJson">Export JSON</button>
        <!-- 全展開/全折りたたみボタン (ドメインセクションがある場合のみ表示) -->
        <button id="btn-toggle-all" class="drv-btn drv-btn-secondary drv-hidden" data-i18n="btnCollapseAll">Collapse All</button>
        <button id="btn-settings" class="drv-btn drv-btn-secondary" data-i18n="btnSettings">Settings</button>
      </div>
    </div>

    <div id="status-bar" class="drv-status-bar drv-hidden"><span id="status-message"></span></div>
    <div id="no-folder-notice" class="drv-notice drv-hidden"><p data-i18n="noFolderNotice"></p></div>
    <!-- スキャン完了したが結果が 0 件の場合の通知 -->
    <div id="no-results-notice" class="drv-notice drv-hidden"><p data-i18n="noResultsNotice"></p></div>
    <div id="period-info" class="drv-period-info drv-hidden"></div>

    <!-- 大サマリー -->
    <div id="summary-section" class="drv-section drv-hidden">
      <h2 class="drv-section-title" data-i18n="sectionSummary">Summary</h2>
      <div class="drv-card-grid-8" id="summary-cards"></div>
      <div class="drv-pie-row" id="pie-row"></div>
    </div>

    <!-- ドメイン別詳細 (動的生成) -->
    <div id="domains-container"></div>

    <!-- フォレンジックレポート -->
    <div id="fr-section" class="drv-section drv-hidden">
      <h2 class="drv-section-title" data-i18n="sectionForensic">Forensic Reports</h2>
      <table class="drv-table" id="fr-table">
        <thead><tr><th data-i18n="colDate">Date</th><th data-i18n="colDomain">Domain</th><th data-i18n="colSourceIp">Source IP</th><th data-i18n="colAuthFailure">Auth Failure</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>

    <!-- 読み取り不能なレポート -->
    <div id="issues-section" class="drv-section drv-hidden">
      <h2 class="drv-section-title" data-i18n="sectionIssues">Unreadable Reports</h2>
      <div class="drv-card-grid-5" style="margin-bottom:12px">
        <div class="drv-card drv-card-fail"><div class="drv-card-label" data-i18n="issueParseFailed">Parse Failed</div><div class="drv-card-value" id="issue-parse-failed">0</div></div>
        <div class="drv-card drv-card-fail"><div class="drv-card-label" data-i18n="issueDecompressFailed">Decompress Failed</div><div class="drv-card-value" id="issue-decompress-failed">0</div></div>
        <div class="drv-card"><div class="drv-card-label" data-i18n="issueIncomplete">Incomplete</div><div class="drv-card-value" id="issue-incomplete">0</div></div>
        <div class="drv-card"><div class="drv-card-label" data-i18n="issueNoAttachment">No Attachment</div><div class="drv-card-value" id="issue-no-attachment">0</div></div>
        <div class="drv-card"><div class="drv-card-label" data-i18n="issueUnknownFormat">Unknown Format</div><div class="drv-card-value" id="issue-unknown-format">0</div></div>
      </div>
      <table class="drv-table" id="issues-table">
        <thead><tr><th data-i18n="colDate">Date</th><th data-i18n="colIssueCategory">Category</th><th>Subject</th><th data-i18n="colIssueDetail">Detail</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>

    <div class="drv-footer">
      <span>DMARC Report Analyzer v<span id="version"></span></span>
      <span class="drv-footer-sep">|</span>
      <span data-i18n="privacyNote">All processing is local.</span>
    </div>
  </div>
  <script src="../parser/analysis.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
